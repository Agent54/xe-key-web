#
# Every push and pull request: the three gates, the tests, and a build of
# all six signed bundles. Nothing is installed, because the project has no
# dependencies, and no secret is used: every bundle is signed with a key
# that exists only in the build process's memory.
#
# Written for Node 24 LTS; anything from Node 22 on works.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NO_COLOR: '1'

jobs:
  check:
    runs-on: [linux-x86_64, xe-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4  # fg-gate-allow: CI checkout action

      - name: Toolchain (Node 22 or newer, nothing to install)
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error("need node >= 22, have " + process.version); process.exit(1); }'
          node --version

      - name: Zero-sink gate
        run: node scripts/zero-sink-check.mjs

      - name: Hygiene gate
        run: node scripts/hygiene-check.mjs

      - name: Icon gate (RGBA scanline check)
        run: node scripts/make-icons.mjs --check

      - name: Fetch xe-iwa-packager when XE_IWA_PACKAGER_REPO is configured
        if: ${{ vars.XE_IWA_PACKAGER_REPO != '' }}
        env:
          PACKAGER_REPO: ${{ vars.XE_IWA_PACKAGER_REPO }}
        run: |
          set -euo pipefail
          FORGE_HOST="$(node -e 'console.log(new URL(process.env.GITHUB_SERVER_URL).hostname)')"
          DEST="${RUNNER_TEMP}/xe-iwa-packager"
          rm -rf "${DEST}"
          git clone --depth 1 "ssh://git@${FORGE_HOST}:2222/${PACKAGER_REPO}.git" "${DEST}"
          echo "IWA_PACKAGER_CLI=${DEST}/bin/xe-iwa-packager.mjs" >> "${GITHUB_ENV}"

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Build and verify the six signed bundles
        run: node scripts/build-swbn.mjs --out dist

      - name: Nothing key-like in the tree or the output (fail closed)
        run: |
          if grep -rlaE -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----' dist/ ; then
            echo "::error::private key material in the build output"; exit 1
          fi
          found="$(find . -path ./.git -prune -o -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p8' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' -o -name '.env.*' \) -print)"
          if [ -n "$found" ]; then
            echo "::error::key-like file: $found"; exit 1
          fi
          (cd dist && sha256sum -- *.swbn *.wbn demo-bundles/*.swbn)
          cat dist/build-info.json

      - name: Headless browser smoke test, when a browser is on the runner
        run: |
          if [ -n "${CHROME_BIN:-}" ] || command -v google-chrome >/dev/null || command -v chromium >/dev/null || command -v chromium-browser >/dev/null; then
            node scripts/smoke-headless.mjs
          else
            echo "no browser on this runner: skipping the smoke test (set CHROME_BIN to run it)"
          fi
