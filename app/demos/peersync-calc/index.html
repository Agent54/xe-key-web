<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>PeerSync Calc</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="hero">
    <img class="hero-cover" src="cover.png" alt="" width="400" height="150">
    <div class="hero-text">
      <img src="icon-192.png" alt="" width="44" height="44">
      <div>
        <h1>PeerSync Calc</h1>
        <p>A calculator with a tape. It can sync and export, but only if you say so.</p>
      </div>
    </div>
  </header>

  <main class="calc-layout">
    <section class="card" aria-labelledby="calc-title">
      <h2 id="calc-title">Calculator</h2>
      <output id="display" class="display" aria-live="polite">0</output>
      <div id="keys" class="keys">
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-op" data-key="/" aria-label="divide">÷</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key-op" data-key="*" aria-label="multiply">×</button>
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-op" data-key="-" aria-label="minus">−</button>
        <button type="button" class="key" data-key="C" aria-label="clear">C</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key" data-key=".">.</button>
        <button type="button" class="key key-op" data-key="+" aria-label="plus">+</button>
        <button type="button" class="key key-equals" data-key="=" aria-label="equals">=</button>
      </div>
    </section>

    <section class="card" aria-labelledby="tape-title">
      <h2 id="tape-title">Tape</h2>
      <p class="hint">Kept in this key origin's storage.</p>
      <ol id="tape" class="tape"></ol>
      <div class="row">
        <button type="button" id="tape-clear" class="btn">Clear the local tape</button>
      </div>
    </section>

    <section class="card card-wide" aria-labelledby="caps-title">
      <h2 id="caps-title">Capabilities</h2>
      <p id="tier" class="tier">Tier 0. This app cannot reach anything. Each button below needs one narrow capability, and asks you for it.</p>
      <div class="row">
        <button type="button" id="sync-push" class="btn btn-primary">Sync the tape to the relay</button>
        <button type="button" id="sync-pull" class="btn">Pull the tape from the relay</button>
        <button type="button" id="export" class="btn">Export the tape as a file</button>
        <button type="button" id="unknown" class="btn">Ask for the whole network</button>
      </div>
      <ul id="status" class="status" aria-live="polite"></ul>
    </section>
  </main>
</body>
</html>
